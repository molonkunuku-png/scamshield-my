services:
  - type: web
    name: scamshield-my
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PORT
        value: 10000

  - type: cron
    name: daily-score-decah
    runtime: python
    plan: free
    schedule: "0 2 * * *"  # daily at 02:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_daily.py
